# Lock It In on Fly.io. Data lives in one JSON file on a volume, so run exactly ONE machine.
app = "lock-it-in"
primary_region = "bos"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "lockitin_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
